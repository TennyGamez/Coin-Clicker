<!DOCTYPE html>
<html>
<head>
  <title>Coin Clicker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f0f0;
      padding-top: 60px;
    }

    h1 {
      font-size: 40px;
    }

    #score {
      font-size: 32px;
      margin: 20px;
    }

    button {
      font-size: 22px;
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #clickButton {
      background: #4CAF50;
      color: white;
      font-size: 30px;
      padding: 25px 50px;
    }

    #upgradeButton {
      background: #2196F3;
      color: white;
    }

    #musicButton {
      background: #8e44ad;
      color: white;
    }

    .downloads {
      margin-top: 40px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>🪙 Coin Clicker</h1>

  <div id="score">Coins: 0</div>

  <button id="clickButton">🪙 CLICK!</button>

  <br>

  <button id="upgradeButton">
    Upgrade (+1 per click) — Cost: 25
  </button>

  <br>

  <button id="musicButton">🎵 Music: OFF</button>

  <div class="downloads">
    🌎 Total Downloads: <span id="downloads">0</span>
  </div>

  <script>
    let coins = 0;
    let power = 1;
    let upgradeCost = 25;

    let audioContext;
    let musicOn = false;
    let musicTimer;

    const score = document.getElementById("score");
    const clickButton = document.getElementById("clickButton");
    const upgradeButton = document.getElementById("upgradeButton");
    const musicButton = document.getElementById("musicButton");

    function startAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playSound(frequency, duration, type, volume) {
      startAudio();

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.value = frequency;

      gain.gain.setValueAtTime(volume, audioContext.currentTime);

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    }

    function playClickSound() {
      playSound(750, 0.07, "square", 0.10);
    }

    function playUpgradeSound() {
      playSound(500, 0.12, "sine", 0.15);

      setTimeout(function() {
        playSound(800, 0.18, "sine", 0.15);
      }, 100);
    }

    function playMusicNote() {
      if (!musicOn) return;

      const notes = [261.63, 329.63, 392, 523.25];
      const note = notes[Math.floor(Math.random() * notes.length)];

      playSound(note, 0.3, "sine", 0.035);
    }

    clickButton.addEventListener("click", function() {
      coins += power;
      playClickSound();
      updateGame();
    });

    upgradeButton.addEventListener("click", function() {
      if (coins >= upgradeCost) {
        coins -= upgradeCost;
        power += 1;
        upgradeCost *= 2;

        playUpgradeSound();
        updateGame();
      } else {
        playSound(180, 0.12, "sawtooth", 0.08);
      }
    });

    musicButton.addEventListener("click", function() {
      startAudio();

      musicOn = !musicOn;

      if (musicOn) {
        musicButton.textContent = "🎵 Music: ON";

        playMusicNote();

        musicTimer = setInterval(function() {
          playMusicNote();
        }, 700);

      } else {
        musicButton.textContent = "🎵 Music: OFF";

        clearInterval(musicTimer);
      }
    });

    function updateGame() {
      score.textContent = "Coins: " + coins;

      upgradeButton.textContent =
        "Upgrade (+" + power + " per click) — Cost: " + upgradeCost;
    }  
    async function updateDownloads() {
  try {
    const response = await fetch(
      "https://coin-clicker-server.onrender.com/count",
      {
        method: "POST"
      }
    );

    const data = await response.json();

    document.getElementById("downloads").textContent =
      data.totalDownloads;
  } catch (error) {
    console.error("Download counter error:", error);
  }
}

updateDownloads();
  </script>

</body>
</html>
