```html
<!DOCTYPE html>
<html>
<head>
  <title>Coin Clicker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f0f0;
      padding-top: 60px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 40px;
    }

    #score {
      font-size: 32px;
      margin: 20px;
    }

    button {
      font-size: 22px;
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #clickButton {
      background: #4CAF50;
      color: white;
      font-size: 30px;
      padding: 25px 50px;
    }

    #upgradeButton {
      background: #2196F3;
      color: white;
    }

    #musicButton {
      background: #8e44ad;
      color: white;
    }

    .downloads {
      margin-top: 40px;
      font-size: 20px;
    }

    /* Falling coins */
    #fallingCoins {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .falling-coin {
      position: absolute;
      top: -50px;
      font-size: 30px;
      animation: fall linear;
    }

    @keyframes fall {
      from {
        transform: translateY(-50px) rotate(0deg);
      }

      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="fallingCoins"></div>

  <h1>🪙 Coin Clicker</h1>

  <div id="score">Coins: 0</div>

  <button id="clickButton">🪙 CLICK!</button>

  <br>

  <button id="upgradeButton">
    Upgrade (+1 per click) — Cost: 25
  </button>

  <br>

  <button id="musicButton">🎵 Music: OFF</button>

  <div class="downloads">
    🌎 Total Downloads: <span id="downloads">0</span>
  </div>

  <script>
    // Load saved game
    let coins = Number(localStorage.getItem("coins")) || 0;
    let power = Number(localStorage.getItem("power")) || 1;
    let upgradeCost = Number(localStorage.getItem("upgradeCost")) || 25;

    let audioContext;
    let musicOn = false;
    let musicTimer;

    const score = document.getElementById("score");
    const clickButton = document.getElementById("clickButton");
    const upgradeButton = document.getElementById("upgradeButton");
    const musicButton = document.getElementById("musicButton");

    // Start audio
    function startAudio() {
      if (!audioContext) {
        audioContext =
          new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    // Play sound
    function playSound(frequency, duration, type, volume) {
      startAudio();

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.value = frequency;

      gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime + duration
      );
    }

    // Click sound
    function playClickSound() {
      playSound(750, 0.07, "square", 0.10);
    }

    // Upgrade sound
    function playUpgradeSound() {
      playSound(500, 0.12, "sine", 0.15);

      setTimeout(function() {
        playSound(800, 0.18, "sine", 0.15);
      }, 100);
    }

    // Music
    function playMusicNote() {
      if (!musicOn) return;

      const notes = [
        261.63,
        329.63,
        392,
        523.25
      ];

      const note =
        notes[Math.floor(Math.random() * notes.length)];

      playSound(note, 0.3, "sine", 0.035);
    }

    // Save game
    function saveGame() {
      localStorage.setItem("coins", coins);
      localStorage.setItem("power", power);
      localStorage.setItem("upgradeCost", upgradeCost);
    }

    // Update game
    function updateGame() {
      score.textContent = "Coins: " + coins;

      upgradeButton.textContent =
        "Upgrade (+" +
        power +
        " per click) — Cost: " +
        upgradeCost;

      saveGame();
    }

    // Click button
    clickButton.addEventListener("click", function() {
      coins += power;

      playClickSound();

      updateGame();
    });

    // Upgrade button
    upgradeButton.addEventListener("click", function() {
      if (coins >= upgradeCost) {

        coins -= upgradeCost;
        power += 1;
        upgradeCost *= 2;

        playUpgradeSound();

        updateGame();

      } else {

        playSound(
          180,
          0.12,
          "sawtooth",
          0.08
        );
      }
    });

    // Music button
    musicButton.addEventListener("click", function() {
      startAudio();

      musicOn = !musicOn;

      if (musicOn) {

        musicButton.textContent =
          "🎵 Music: ON";

        playMusicNote();

        musicTimer = setInterval(
          function() {
            playMusicNote();
          },
          700
        );

      } else {

        musicButton.textContent =
          "🎵 Music: OFF";

        clearInterval(musicTimer);
      }
    });

    // Global download counter
    async function updateDownloads() {
      try {

        const response = await fetch(
          "https://coin-clicker-server.onrender.com/count",
          {
            method: "POST"
          }
        );

        const data = await response.json();

        document.getElementById("downloads").textContent =
          data.totalDownloads;

      } catch (error) {

        console.error(
          "Download counter error:",
          error
        );
      }
    }

    // Create falling coin
    function createFallingCoin() {

      const coin =
        document.createElement("div");

      coin.className = "falling-coin";

      coin.textContent = "🪙";

      coin.style.left =
        Math.random() * 100 + "%";

      coin.style.fontSize =
        (20 + Math.random() * 25) + "px";

      coin.style.animationDuration =
        (3 + Math.random() * 5) + "s";

      document
        .getElementById("fallingCoins")
        .appendChild(coin);

      setTimeout(function() {
        coin.remove();
      }, 8000);
    }

    // Keep creating coins
    setInterval(
      createFallingCoin,
      400
    );

    // Load saved game on startup
    updateGame();

    // Update global counter
    updateDownloads();
  </script>

</body>
</html>
